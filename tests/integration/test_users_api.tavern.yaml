---
test_name: Test OAuth Headers Integration
stages:
  - name: Test OAuth proxy authentication with admin headers
    request:
      url: "{tavern.env_vars.TEST_BACKEND_URL}/api/v1/users/profile"
      method: GET
      headers:
        Accept: application/json
    response:
      status_code: 200
      json:
        username: "dev-user"
        email: "dev@localhost.dev"
        role: "admin"
        agent_ids: !anything
        keycloak_id: !anything
