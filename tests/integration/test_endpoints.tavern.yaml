---
test_name: Test Models API Endpoint
stages:
  - name: Test GET /api/v1/llama_stack/llms
    request:
      url: "{tavern.env_vars.TEST_FRONTEND_URL}/api/v1/llama_stack/llms"
      method: GET
      headers:
        Accept: application/json
    response:
      status_code: 200
      headers:
        content-type: application/json
      verify_response_with:
        - function: tests.integration.validators:validate_llms_response
---
test_name: Test Virtual Agents API Endpoint
stages:
  - name: Get an available model
    request:
      url: "{tavern.env_vars.TEST_BACKEND_URL}/api/v1/llama_stack/llms"
      method: GET
      headers:
        Accept: application/json
    response:
      status_code: 200
      save:
        json:
          model_name: "[0].model_name"
  - name: Test POST /api/v1/virtual_agents
    request:
      url: "{tavern.env_vars.TEST_BACKEND_URL}/api/v1/virtual_agents/"
      method: POST
      headers:
        Accept: application/json
      json:
        name: "Test Assistant"
        prompt: "You are a helpful assistant."
        model_name: "{model_name}"
        input_shields: []
        output_shields: []
        knowledge_base_ids: []
        tools: []
    response:
      status_code: 201
      headers:
        content-type: application/json
      save:
        json:
          agent_id: "id"
  - name: Test GET /api/v1/virtual_agents
    request:
      url: >-
        {tavern.env_vars.TEST_BACKEND_URL}/api/v1/virtual_agents/{agent_id}
      method: GET
      headers:
        Accept: application/json
    response:
      status_code: 200
      headers:
        content-type: application/json
      json:
        category: null
        template_id: null
        template_name: null
        suite_id: null
        suite_name: null
        sampling_strategy: null
        name: "Test Assistant"
        runner_type: "llamastack"
        prompt: "You are a helpful assistant."
        model_name: "{model_name}"
        input_shields: []
        output_shields: []
        temperature: null
        repetition_penalty: null
        max_tokens: null
        top_p: null
        top_k: null
        knowledge_base_ids: []
        vector_store_ids: []
        tools: []
        max_infer_iters: 100
        graph_config: null
        id: "{agent_id}"
        created_at: !anything
        updated_at: !anything
  - name: Test DELETE /api/v1/virtual_agents
    request:
      url: >-
        {tavern.env_vars.TEST_BACKEND_URL}/api/v1/virtual_agents/{agent_id}
      method: DELETE
      headers:
        Accept: application/json
    response:
      status_code: 204
---
test_name: Test LlamaStack Providers API
stages:
  - name: Test GET /api/v1/llama_stack/providers
    request:
      url: "{tavern.env_vars.TEST_BACKEND_URL}/api/v1/llama_stack/providers"
      method: GET
      headers:
        Accept: application/json
    response:
      status_code: 200
      verify_response_with:
        - function: tests.integration.validators:validate_providers_response
