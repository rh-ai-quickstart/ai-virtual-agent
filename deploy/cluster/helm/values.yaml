# Default values for ai-virtual-agent.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: quay.io/rh-ai-quickstart/ai-virtual-agent
  # This sets the pull policy for images.
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "1.1.17"

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "ai-virtual-agent-sa"

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 8000


resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe: {}
#  httpGet:
#    path: /
#    port: http

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}

pgSecret: pgvector

llama_stack_url: http://llamastack:8321

# Runner LLM Configuration (for LangGraph and CrewAI direct-to-model inference)
# When set, these bypass LlamaStack and point runners at an external MaaS endpoint.
runners:
  langgraph:
    llm_api_base: ""
    llm_api_key: ""
    default_model: ""
  crewai:
    llm_api_base: ""
    llm_api_key: ""
    default_model: ""

# MCP server URLs injected into the backend pod.
# These must match the service names created by the mcp-servers subchart.
mcp:
  travel_research_url: "http://mcp-travel-research:8000/mcp"
  hotel_url: "http://mcp-hotel:8000/mcp"
  flight_url: "http://mcp-flight:8000/mcp"

# API keys passed to the backend container (for CrewAI local tool fallback)
apiKeys:
  tavily: ""
  serpapi: ""

adminUsername: admin

autoAssignAgents: true

# Application admin user (created in ai-apps realm during setup)
appAdmin:
  username: admin
  email: ""
  password: ""

pgvector:
  extraDatabases:
  - name: ai_virtual_agent
    vectordb: false
  - name: keycloak
    vectordb: false

configure-pipeline:
  minio:
    secret:
      user: minio_rag_user
      password: minio_rag_password
      host: minio
      port: "9000"

      # Upload sample files to the minio bucket
    sampleFileUpload:
      enabled: true
      bucket: documents
      urls:
      - https://raw.githubusercontent.com/burrsutter/sample-pdfs/main/FantaCo/HR/FantaCo-Fabulous-HR-Benefits.pdf

oracle-db:
  enabled: false

# Keycloak OIDC configuration (app-level)
oidc:
  clientId: ai-virtual-agent
  realmName: ai-apps

# Keycloak setup job configuration
setupJob:
  image:
    repository: registry.access.redhat.com/ubi9/ubi
    tag: "latest"
  retries: 30
  retryInterval: 10

# Orphaned user cleanup CronJob
# Deletes DB user rows whose keycloak_id no longer exists in Keycloak
userCleanup:
  enabled: true
  schedule: "0 */12 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  activeDeadlineSeconds: 600
  backoffLimit: 2

# Keycloak subchart overrides
keycloak:
  enabled: true
  fullnameOverride: keycloak
  admin:
    username: admin
    password: ""
  pgvector:
    enabled: true
    fullnameOverride: keycloak-pgvector
    externalDatabase:
      enabled: true
      host: pgvector
      port: "5432"
      user: postgres
      password: ""
      dbname: keycloak
    secret:
      user: postgres
      password: ""
      dbname: keycloak
      host: pgvector
      port: "5432"
  config:
    hostname: ""
    hostnameStrict: false
  route:
    enabled: true
    host: ""

llama-stack:
  serviceAccount:
    create: false
    name: ai-virtual-agent-sa
  auth:
    provider_config:
      type: "custom"
      endpoint: http://ai-virtual-agent:8000/validate
    access_policy:
    - permit:
        actions: [create]
        resource: session::*
      description: all users have create access to sessions
    - permit:
        actions: [read]
        resource: agent::*
      description: all users have read access to agents
    - permit:
        actions: [read]
        resource: tool_group::*
      description: all users have read access to tool_groups
    - permit:
        actions: [read]
        resource: model::*
      description: all users have read access to models
    - permit:
        actions: [read]
        resource: vector_db::*
      description: all users have read access to vector_dbs
    - permit:
        actions: [create, update, delete]
        resource: vector_db::*
      when: user with admin in roles
      description: users with the admin role can create, update or delete vector_dbs
    - permit:
        actions: [read]
        resource: vector_store::*
      description: all users have read access to vector_store
    - permit:
        actions: [create, update, delete]
        resource: vector_store::*
      when: user with admin in roles
      description: users with the admin role can create, update or delete vector_stores
    - permit:
        actions: [read]
        resource: shield::*
      description: all users have read access to shields
    - permit:
        actions: [create, update, delete]
        resource: shield::*
      when: user with admin in roles
      description: users with the admin role can create, update or delete shields
    - permit:
        actions: [create, update, delete]
        resource: tool_group::*
      when: user with admin in roles
      description: users with the admin role can create, update or delete tool_groups
    - forbid:
        actions: [create, update, delete]
      unless: user with admin in roles
      description: only users with the admin role can create, update or delete resources
    - permit:
        actions: [read, update, delete]
      when: user is owner
      description: users can read, update and delete resources they own
  secrets:
    TAVILY_SEARCH_API_KEY: ""

# Vacation-planner MCP servers deployed via the mcp-servers subchart.
# Images must be pre-built and pushed to the repository below.
mcp-servers:
  mcp-servers:
    travel-research:
      enabled: true
      deploymentMode: deployment
      image:
        repository: quay.io/rh-ai-quickstart/mcp-travel-research
        tag: "latest"
      transport: streamable-http
      port: 8000
      targetPort: 8000
    hotel:
      enabled: true
      deploymentMode: deployment
      image:
        repository: quay.io/rh-ai-quickstart/mcp-hotel
        tag: "latest"
      transport: streamable-http
      port: 8000
      targetPort: 8000
    flight:
      enabled: true
      deploymentMode: deployment
      image:
        repository: quay.io/rh-ai-quickstart/mcp-flight
        tag: "latest"
      transport: streamable-http
      port: 8000
      targetPort: 8000

