{{- if .Values.keycloak.enabled }}
{{- $secretName := printf "%s-oidc" (include "ai-virtual-agent.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "ai-virtual-agent.labels" . | nindent 4 }}
type: Opaque
{{- if $existing }}
data:
  oidc-client-secret: {{ index $existing.data "oidc-client-secret" }}
  session-secret-key: {{ index $existing.data "session-secret-key" }}
{{- else }}
stringData:
  oidc-client-secret: {{ .Values.oidc.clientSecret | default (randAlphaNum 32) | quote }}
  session-secret-key: {{ .Values.oidc.sessionSecretKey | default (randAlphaNum 32) | quote }}
{{- end }}
{{- end }}
