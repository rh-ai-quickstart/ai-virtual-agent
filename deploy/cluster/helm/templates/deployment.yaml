{{- include "ai-virtual-agent.validateKeycloak" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-virtual-agent.fullname" . }}
  labels:
    {{- include "ai-virtual-agent.labels" . | nindent 4 }}
spec:
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds | default 1800 }}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ai-virtual-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if .Values.keycloak.enabled }}
        checksum/oidc-secret: {{ include (print $.Template.BasePath "/keycloak-oidc-secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "ai-virtual-agent.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ai-virtual-agent.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-llamastack
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          command:
            - /bin/bash
            - -c
            - |
              set -e
              url=http://llamastack.{{ .Release.Namespace }}.svc.cluster.local:8321
              echo "Waiting for $url..."
              until curl -ks "$url"; do
                echo "Still waiting for $url ..."
                sleep 10
              done
              echo "$url is ready."
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.pgSecret }}
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.pgSecret }}
                  key: port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.pgSecret }}
                  key: user
            - name: DB_NAME
              value: {{ (index .Values.pgvector.extraDatabases 0).name }}
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.pgSecret }}
                  key: password
            - name: DATABASE_URL
              value: 'postgresql+asyncpg://$(DB_USER):$(DB_PASS)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)'
            - name: LLAMASTACK_URL
              value: '{{ .Values.llama_stack_url }}'
            - name: INGESTION_PIPELINE_URL
              value: http://{{ .Release.Name }}-ingestion-pipeline
            - name: ADMIN_USERNAME
              value: '{{ .Values.adminUsername }}'
            - name: AUTO_ASSIGN_AGENTS_TO_USERS
              value: '{{ .Values.autoAssignAgents }}'
            {{- with .Values.runners.langgraph.llm_api_base }}
            - name: LANGGRAPH_LLM_API_BASE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.runners.langgraph.llm_api_key }}
            - name: LANGGRAPH_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-virtual-agent.fullname" $ }}-env
                  key: LANGGRAPH_LLM_API_KEY
            {{- end }}
            {{- with .Values.runners.langgraph.default_model }}
            - name: LANGGRAPH_DEFAULT_MODEL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.runners.crewai.llm_api_base }}
            - name: CREWAI_LLM_API_BASE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.runners.crewai.llm_api_key }}
            - name: CREWAI_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-virtual-agent.fullname" $ }}-env
                  key: CREWAI_LLM_API_KEY
            {{- end }}
            {{- with .Values.runners.crewai.default_model }}
            - name: CREWAI_DEFAULT_MODEL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.mcp.travel_research_url }}
            - name: TRAVEL_RESEARCH_MCP_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.mcp.hotel_url }}
            - name: HOTEL_MCP_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.mcp.flight_url }}
            - name: FLIGHT_MCP_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.apiKeys.tavily }}
            - name: TAVILY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-virtual-agent.fullname" $ }}-env
                  key: TAVILY_API_KEY
            {{- end }}
            {{- with .Values.apiKeys.serpapi }}
            - name: SERPAPI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-virtual-agent.fullname" $ }}-env
                  key: SERPAPI_API_KEY
            {{- end }}
            {{- if .Values.keycloak.enabled }}
            - name: KEYCLOAK_SERVER_URL
              value: {{ .Values.keycloak.config.hostname | quote }}
            - name: KEYCLOAK_SERVER_URL_INTERNAL
              value: "http://keycloak:8080"
            - name: KEYCLOAK_REALM
              value: {{ .Values.oidc.realmName | quote }}
            - name: KEYCLOAK_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-virtual-agent.fullname" . }}-oidc
                  key: oidc-client-secret
            - name: SESSION_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-virtual-agent.fullname" . }}-oidc
                  key: session-secret-key
            - name: SESSION_COOKIE_SECURE
              value: "true"
            {{- if .Values.clusterDomain }}
            - name: FRONTEND_URL
              value: "https://{{ include "ai-virtual-agent.fullname" . }}-{{ .Release.Namespace }}.{{ .Values.clusterDomain }}"
            {{- end }}
            - name: LOCAL_DEV_ENV_MODE
              value: "false"
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
